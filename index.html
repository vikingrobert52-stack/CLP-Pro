<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur CLP Pro</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; text-align: center; }
        .box { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        h1 { color: #60a5fa; }
        textarea { width: 100%; height: 80px; padding: 10px; background: #0b1120; color: white; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .result { margin-top: 15px; min-height: 200px; background: #0b1120; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        img { max-width: 100%; }
    </style>
</head>
<body>
<div class="box">
    <h1>🎬 Générateur CLP</h1>
    <textarea id="p" placeholder="Décris ton image..."></textarea>
    <button id="btn" onclick="gen()">✨ Générer</button>
    <div class="result" id="res">
        <span id="ld" style="display:none">⏳ Chargement...</span>
    </div>
</div>

<script>
function gen() {
    alert("Le bouton fonctionne !");
    
    var v = document.getElementById('p').value.trim();
    if(!v) { alert("Entre une description."); return; }
    
    var btn = document.getElementById('btn');
    var ld = document.getElementById('ld');
    var res = document.getElementById('res');
    
    btn.disabled = true;
    ld.style.display = 'inline';
    res.innerHTML = '';
    res.appendChild(ld);
    
    var seed = Date.now();
    var apiUrl = 'https://picsum.photos/1024/1024?random=' + seed;
    
    var img = new Image();
    img.onload = function() {
        ld.style.display = 'none';
        res.innerHTML = '';
        res.appendChild(img);
        btn.disabled = false;
    };
    img.onerror = function() {
        ld.style.display = 'none';
        res.innerHTML = '<p style="color:red">Erreur.</p>';
        btn.disabled = false;
    };
    img.src = apiUrl;
}
</script>
</body>
</html>
